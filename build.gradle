// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply plugin: 'com.github.ben-manes.versions'

buildscript {
    repositories {
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://storage.flutter.io/download.flutter.io' }
        google()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath Deps.kotlin_plugin
        classpath Dagger.hiltPlugin
        classpath 'com.github.ben-manes:gradle-versions-plugin:0.36.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

configurations {
    dependencyUpdates.resolutionStrategy {
        componentSelection { rules ->
            rules.all { ComponentSelection selection ->
                boolean rejected = ['alpha', 'beta', 'rc', 'cr', 'm', 'preview'].any { qualifier ->
                    selection.candidate.version ==~ /(?i).*[.-]${qualifier}[.\d-]*/
                }
                if (rejected) {
                    selection.reject('Release candidate')
                }
            }
        }
    }
}

static def isNonStable(v) {
    ["-alpha", "-beta", "-rc", "-m"].any { v.toLowerCase().contains(it) }
}

tasks.named("dependencyUpdates").configure {

    // Example 2: disallow release candidates as upgradable versions from stable versions
    rejectVersionIf {
        isNonStable(it.candidate.version) && !isNonStable(it.currentVersion)
    }
}

allprojects {
    repositories {
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://storage.flutter.io/download.flutter.io' }
        google()
        mavenCentral()
        jcenter()
    }
    configurations.all {
        resolutionStrategy {
            force 'androidx.lifecycle:lifecycle-viewmodel:2.5.1'
            force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
            force 'androidx.lifecycle:lifecycle-livedata:2.5.1'
            force 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
            force 'androidx.lifecycle:lifecycle-runtime:2.5.1'
            force 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
            force 'androidx.lifecycle:lifecycle-common:2.5.1'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
